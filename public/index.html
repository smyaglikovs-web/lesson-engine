<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin="anonymous"></script>
  <script>
    window.onerror = function(msg, url, line) {
      var root = document.getElementById('root');
      if (root) {
        root.innerHTML = '<div style="padding:30px;color:#b91c1c;background:#fef2f2;font-family:sans-serif;border-radius:12px;margin:20px;"><h3>⚠️ Ошибка скрипта:</h3><p>'+msg+'</p><p>Строка: '+line+'</p></div>';
      }
    };
  </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const DEFAULT_NEW_JSON = {
      "title": "B1 Grammar & Video Lesson: Present Continuous",
      "level": "B1",
      "topic": "Грамматика и Видео",
      "description": "Урок с поддержкой видео YouTube, аудио, упражнений и домашнего задания.",
      "pages": [
        {
          "id": "p1",
          "title": "Часть 1: Видео и Правило",
          "blocks": [
            { "id": "b1", "type": "heading", "level": 1, "text": "Present Continuous in English" },
            {
              "id": "b2",
              "type": "video",
              "title": "Посмотрите обучающее видео:",
              "url": "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
            },
            {
              "id": "b3",
              "type": "grammar_card",
              "title": "Правило образования",
              "formula": "Subject + am / is / are + Verb-ing",
              "explanation": "Используется для запланированных действий в будущем.",
              "examples": ["I am meeting my friends tonight.", "She is flying to London tomorrow."]
            }
          ]
        },
        {
          "id": "p2",
          "title": "Часть 2: Интерактивная практика",
          "blocks": [
            {
              "id": "b4",
              "type": "multiple_choice",
              "question": "Какой вариант верный для запланированной встречи завтра?",
              "options": ["I meet my doctor tomorrow", "I am meeting my doctor tomorrow", "I met my doctor tomorrow"],
              "correct": 1,
              "explanation": "Для запланированных встреч используем Present Continuous (am meeting)."
            },
            {
              "id": "b5",
              "type": "matching",
              "instruction": "Соедините слова:",
              "pairs": [
                { "left": "Fly", "right": "Flying" },
                { "left": "Run", "right": "Running" },
                { "left": "Make", "right": "Making" }
              ]
            },
            {
              "id": "b6",
              "type": "open_input",
              "prompt": "Напишите ваши планы на завтра (2 предложения):",
              "placeholder": "Tomorrow I am..."
            }
          ]
        },
        {
          "id": "p3",
          "title": "Часть 3: Домашнее задание (Vocabulary Practice)",
          "blocks": [
            { "id": "b7", "type": "heading", "level": 2, "text": "Homework: Vocabulary & Grammar Practice" },
            {
              "id": "b8",
              "type": "gap_fill",
              "instruction": "Заполните пропуск нужной формой глагола:",
              "text": "She [is flying] to London tomorrow morning.",
              "answers": ["is flying"]
            }
          ]
        }
      ]
    };

    function getYouTubeEmbedUrl(url) {
      if (!url) return null;
      if (url.indexOf('embed/') !== -1) return url;
      if (url.indexOf('watch?v=') !== -1) {
        var parts = url.split('watch?v=')[1];
        var id = parts ? parts.split('&')[0] : '';
        return 'https://www.youtube.com/embed/' + id;
      }
      if (url.indexOf('youtu.be/') !== -1) {
        var parts = url.split('youtu.be/')[1];
        var id = parts ? parts.split('?')[0] : '';
        return 'https://www.youtube.com/embed/' + id;
      }
      return url;
    }

    const BlockHeading = ({ block }) => {
      const level = block.level || 2;
      const styles = { 1: "text-3xl font-bold text-slate-800 mb-4", 2: "text-2xl font-bold text-slate-800 mb-3", 3: "text-xl font-semibold text-slate-700 mb-2" };
      if (level === 1) return <h1 className={styles[1]}>{block.text}</h1>;
      if (level === 3) return <h3 className={styles[3]}>{block.text}</h3>;
      return <h2 className={styles[2]}>{block.text}</h2>;
    };

    const BlockText = ({ block }) => <p className="text-slate-600 text-lg leading-relaxed mb-4">{block.text}</p>;

    const BlockImage = ({ block, onEditMedia }) => (
      <div className="my-6 relative group">
        <img src={block.url} alt={block.caption || 'Visual'} className="w-full max-h-96 object-cover rounded-xl shadow-md" />
        {block.caption && <p className="text-sm text-slate-500 text-center mt-2">{block.caption}</p>}
        {onEditMedia && (
          <button
            onClick={() => onEditMedia(block.id, 'url', block.url)}
            className="absolute top-3 right-3 bg-slate-900/80 hover:bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition"
          >
            🔗 Вставить ссылку на фото
          </button>
        )}
      </div>
    );

    const BlockVideo = ({ block, onEditMedia }) => {
      const embedUrl = getYouTubeEmbedUrl(block.url);
      const isYouTube = embedUrl && embedUrl.indexOf('youtube.com/embed') !== -1;

      return (
        <div className="my-6 relative group">
          {block.title && <h4 className="font-semibold text-lg text-slate-800 mb-3">{block.title}</h4>}
          <div className="aspect-video w-full rounded-xl overflow-hidden bg-slate-900 shadow-md">
            {isYouTube ? (
              <iframe src={embedUrl} className="w-full h-full border-0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowFullScreen></iframe>
            ) : (
              <video controls className="w-full h-full"><source src={block.url} type="video/mp4" /></video>
            )}
          </div>
          {onEditMedia && (
            <button
              onClick={() => onEditMedia(block.id, 'url', block.url)}
              className="mt-2 bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold px-3 py-1.5 rounded-lg shadow transition"
            >
              🔗 Изменить ссылку на видео (YouTube / MP4)
            </button>
          )}
        </div>
      );
    };

    const BlockAudio = ({ block, onEditMedia }) => {
      const [showTranscript, setShowTranscript] = useState(false);
      return (
        <div className="bg-slate-900 text-white p-6 rounded-xl shadow-md mb-6 relative">
          <div className="flex items-center justify-between mb-4">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white">🎧</div>
              <h4 className="font-semibold text-lg">{block.title || 'Прослушайте запись:'}</h4>
            </div>
            {onEditMedia && (
              <button
                onClick={() => onEditMedia(block.id, 'url', block.url)}
                className="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-lg border border-slate-700"
              >
                🔗 Вставить MP3 ссылку
              </button>
            )}
          </div>
          <audio controls className="w-full mb-4"><source src={block.url} type="audio/mpeg" /></audio>
          {block.transcript && (
            <div>
              <button onClick={() => setShowTranscript(!showTranscript)} className="text-xs text-indigo-400 hover:text-indigo-300 underline font-medium">
                {showTranscript ? 'Скрыть текст' : 'Показать транскрипт'}
              </button>
              {showTranscript && <div className="mt-3 p-3 bg-slate-800 rounded-lg text-sm text-slate-300 whitespace-pre-line border border-slate-700">{block.transcript}</div>}
            </div>
          )}
        </div>
      );
    };

    const BlockMultipleChoice = ({ block, value, onChange }) => {
      const selected = value?.selected ?? null;
      const submitted = value?.submitted ?? false;
      const isCorrect = selected === block.correct;

      const handleSelect = (idx) => { if (submitted) return; onChange({ selected: idx, submitted: false }); };
      const handleSubmit = () => { if (selected === null) return; onChange({ selected, submitted: true }); };

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          <h4 className="font-semibold text-lg text-slate-800 mb-4">{block.question}</h4>
          <div className="space-y-2 mb-4">
            {block.options?.map((option, idx) => {
              let btnStyle = "w-full text-left p-3 rounded-lg border text-slate-700 transition ";
              if (submitted) {
                if (idx === block.correct) btnStyle += "bg-green-50 border-green-500 text-green-900 font-medium";
                else if (idx === selected) btnStyle += "bg-red-50 border-red-500 text-red-900";
                else btnStyle += "border-slate-200 opacity-50";
              } else {
                btnStyle += idx === selected ? "border-indigo-600 bg-indigo-50 text-indigo-900" : "border-slate-200 hover:bg-slate-50";
              }
              return <button key={`${block.id}-opt-${idx}`} disabled={submitted} onClick={() => handleSelect(idx)} className={btnStyle}>{option}</button>;
            })}
          </div>
          {!submitted ? (
            <button disabled={selected === null} onClick={handleSubmit} className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50">Ответить</button>
          ) : (
            <div className={submitted ? (isCorrect ? 'mt-4 p-4 rounded-lg text-sm bg-green-100 text-green-800' : 'mt-4 p-4 rounded-lg text-sm bg-red-100 text-red-800') : ''}>
              <p className="font-bold mb-1">{isCorrect ? 'Правильно! 🎉' : 'Неверно ❌'}</p>
              {block.explanation && <p>{block.explanation}</p>}
            </div>
          )}
        </div>
      );
    };

    const BlockGapFill = ({ block, value, onChange }) => {
      const userAnswer = value?.userAnswer || '';
      const submitted = value?.submitted || false;
      const isCorrect = block.answers?.some(ans => ans.trim().toLowerCase() === userAnswer.trim().toLowerCase());

      const handleSubmit = () => { if (!userAnswer.trim()) return; onChange({ userAnswer, submitted: true }); };

      const parts = block.text ? block.text.split('[') : ['', ''];
      const firstPart = parts[0] || '';
      const secondPart = parts[1] ? parts[1].split(']')[1] || '' : '';

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          {block.instruction && <p className="text-slate-600 mb-3">{block.instruction}</p>}
          <div className="flex flex-wrap items-center gap-2 text-lg mb-4">
            <span>{firstPart}</span>
            <input
              type="text"
              value={userAnswer}
              disabled={submitted}
              onChange={(e) => onChange({ userAnswer: e.target.value, submitted: false })}
              className={submitted ? (isCorrect ? 'border-b-2 outline-none px-2 py-1 text-center font-medium border-green-500 bg-green-50 text-green-900' : 'border-b-2 outline-none px-2 py-1 text-center font-medium border-red-500 bg-red-50 text-red-900') : 'border-b-2 outline-none px-2 py-1 text-center font-medium border-indigo-500'}
              placeholder="введите ответ"
            />
            <span>{secondPart}</span>
          </div>
          {!submitted ? (
            <button disabled={!userAnswer.trim()} onClick={handleSubmit} className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50">Проверить</button>
          ) : (
            <div className={isCorrect ? 'mt-2 p-3 rounded-lg text-sm bg-green-100 text-green-800' : 'mt-2 p-3 rounded-lg text-sm bg-red-100 text-red-800'}>
              {isCorrect ? 'Отлично!' : ('Правильный ответ: ' + (block.answers?.join(' или ') || ''))}
            </div>
          )}
        </div>
      );
    };

    const shuffleArray = (arr) => {
      const res = [...arr];
      for (let i = res.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [res[i], res[j]] = [res[j], res[i]];
      }
      return res;
    };

    const BlockMatching = ({ block, value, onChange }) => {
      const matched = value?.matched || [];
      const [selectedLeft, setSelectedLeft] = useState(null);
      const [wrongPair, setWrongPair] = useState(false);

      const rightItems = useMemo(() => {
        return shuffleArray((block.pairs || []).map(p => p.right));
      }, [block.id]);

      const handleLeftClick = (leftText) => { if (matched.some(m => m.left === leftText)) return; setSelectedLeft(leftText); setWrongPair(false); };
      const handleRightClick = (rightText) => {
        if (!selectedLeft || matched.some(m => m.right === rightText)) return;
        const correctPair = block.pairs.find(p => p.left === selectedLeft && p.right === rightText);
        if (correctPair) {
          const newMatched = [...matched, { left: selectedLeft, right: rightText }];
          onChange({ matched: newMatched });
          setSelectedLeft(null);
        } else {
          setWrongPair(true);
          setTimeout(() => setWrongPair(false), 1000);
        }
      };

      const isCompleted = matched.length === (block.pairs?.length || 0);
      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          <h4 className="font-semibold text-lg text-slate-800 mb-4">{block.instruction || 'Соедините пары:'}</h4>
          <div className="grid grid-cols-2 gap-4 mb-4">
            <div className="space-y-2">
              {block.pairs?.map((p, idx) => {
                const isMatched = matched.some(m => m.left === p.left);
                const isSelected = selectedLeft === p.left;
                let style = "w-full p-3 text-left rounded-lg border font-medium transition text-sm ";
                if (isMatched) style += "bg-green-50 border-green-500 text-green-800 opacity-60";
                else if (isSelected) style += "bg-indigo-50 border-indigo-600 text-indigo-900 shadow-sm";
                else style += "bg-slate-50 border-slate-200 hover:border-indigo-400 text-slate-700";
                return <button key={`${block.id}-left-${idx}`} disabled={isMatched} onClick={() => handleLeftClick(p.left)} className={style}>{p.left} {isMatched && '✓'}</button>;
              })}
            </div>
            <div className="space-y-2">
              {rightItems.map((rightText, idx) => {
                const isMatched = matched.some(m => m.right === rightText);
                let style = "w-full p-3 text-left rounded-lg border font-medium transition text-sm ";
                if (isMatched) style += "bg-green-50 border-green-500 text-green-800 opacity-60";
                else if (wrongPair && selectedLeft) style += "bg-red-50 border-red-300 text-slate-700";
                else style += "bg-slate-50 border-slate-200 hover:border-indigo-400 text-slate-700";
                return <button key={`${block.id}-right-${idx}`} disabled={isMatched} onClick={() => handleRightClick(rightText)} className={style}>{rightText} {isMatched && '✓'}</button>;
              })}
            </div>
          </div>
          {isCompleted && <div className="p-3 bg-green-100 text-green-800 rounded-lg text-sm font-bold text-center">Все пары соединены верно 🎉</div>}
        </div>
      );
    };

    const BlockOpenInput = ({ block, value, onChange }) => {
      const text = value?.text || '';
      const wordCount = text.trim() ? text.trim().split(' ').filter(Boolean).length : 0;

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          <h4 className="font-semibold text-lg text-slate-800 mb-2">{block.prompt}</h4>
          <textarea
            rows="4"
            value={text}
            onChange={(e) => onChange({ text: e.target.value })}
            placeholder={block.placeholder || "Введите ответ..."}
            className="w-full p-4 border border-slate-200 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500 mb-2 text-slate-700 text-sm"
          ></textarea>
          <div className="flex justify-between items-center text-xs text-slate-400">
            <span>Количество слов: {wordCount}</span>
            <span className="text-emerald-600 font-medium">{text ? 'Ответ сохранен ✓' : ''}</span>
          </div>
        </div>
      );
    };

    const BlockGrammarCard = ({ block }) => (
      <div className="bg-gradient-to-r from-indigo-50 to-blue-50 border border-indigo-100 p-6 rounded-xl shadow-sm mb-6">
        <div className="flex items-center gap-2 mb-2">
          <span className="px-2.5 py-0.5 bg-indigo-600 text-white text-xs font-bold rounded-full uppercase">Правило</span>
          <h3 className="text-xl font-bold text-slate-800">{block.title}</h3>
        </div>
        {block.formula && <div className="my-3 p-3 bg-white border border-indigo-200 rounded-lg font-mono text-indigo-900 font-bold text-center">{block.formula}</div>}
        {block.explanation && <p className="text-slate-600 text-sm mb-3">{block.explanation}</p>}
        {block.examples?.length > 0 && (
          <div className="space-y-1">
            <p className="text-xs font-bold text-slate-400 uppercase tracking-wider">Примеры:</p>
            {block.examples.map((ex, idx) => <p key={idx} className="text-sm font-medium text-slate-700 italic">&bull; "{ex}"</p>)}
          </div>
        )}
      </div>
    );

    const BlockRenderer = ({ block, value, onChange, isTeacher, onEditMedia }) => {
      switch (block.type) {
        case 'heading': return <BlockHeading block={block} />;
        case 'text': return <BlockText block={block} />;
        case 'image': return <BlockImage block={block} onEditMedia={onEditMedia} />;
        case 'video': return <BlockVideo block={block} onEditMedia={onEditMedia} />;
        case 'multiple_choice': return <BlockMultipleChoice block={block} value={value} onChange={onChange} />;
        case 'gap_fill': return <BlockGapFill block={block} value={value} onChange={onChange} />;
        case 'matching': return <BlockMatching block={block} value={value} onChange={onChange} />;
        case 'audio': return <BlockAudio block={block} onEditMedia={onEditMedia} />;
        case 'open_input': return <BlockOpenInput block={block} value={value} onChange={onChange} />;
        case 'grammar_card': return <BlockGrammarCard block={block} />;
        default: return <div className="p-4 bg-amber-50 text-amber-800 rounded-lg">Тип блока: {block.type}</div>;
      }
    };

    const AIPromptsView = () => {
      const [copiedIdx, setCopiedIdx] = useState(null);
      const NL = String.fromCharCode(10);

      const promptTextbook = [
        "Ты — опытный методист английского языка и эксперт по составлению учебных материалов.",
        "Я отправляю тебе материалы из учебника / PDF (текст, правила, упражнения).",
        "",
        "ТВОЯ ГЛАВНАЯ ЗАДАЧА:",
        "1. Проанализируй весь исходный материал.",
        "2. РЕШИ ВСЕ УПРАЖНЕНИЯ ИЗ УЧЕБНИКА! Вычисли правильные ответы для всех тестов, пропусков и сопоставлений.",
        "3. Сохрани оригинальные тексты, заголовки и формулировки упражнений из учебника.",
        "4. Закодируй ВСЕ упражнения в интерактивный JSON формат c правильными ответами.",
        "5. СОЗДАЙ ДОПОЛНИТЕЛЬНУЮ СТРАНИЦУ 'Домашнее задание' (Homework) с упражнениями на закрепление ключевой лексики уроков.",
        "",
        "ПРАВИЛА ТИПОВ БЛОКОВ В JSON:",
        "- heading: Заголовки (level: 1, 2 или 3).",
        "- text: Тексты для чтения и статьи.",
        "- grammar_card: Карточки с правилами и лексикой (title, formula, explanation, examples).",
        "- multiple_choice: Вопросы с выбором (options: [...], correct: ИНДЕКС_ПРАВИЛЬНОГО_ОТВЕТА от 0, explanation).",
        "- gap_fill: Пропуски в тексте. Текст формата 'Start [answer] end.', answers: ['answer'].",
        "- matching: Соединить пары. pairs: [{ 'left': 'слово', 'right': 'правильная_пара' }]. Pairs должны быть ИЗНАЧАЛЬНО ВЕРНО СОЕДИНЕНЫ!",
        "- open_input: Открытые вопросы для обсуждения (prompt, placeholder).",
        "",
        "КРИТИЧЕСКИЕ ПРАВИЛА ФОРМАТА JSON:",
        "1. Верни СТРОГО чистый JSON без маркдаун оберток.",
        "2. НЕ используй двойные кавычки внутри текста! Используй ТОЛЬКО одинарные кавычки ' (например, 'Looksmaxxing', 'Empower').",
        "",
        "ПРИМЕР СТРУКТУРЫ JSON:",
        "{",
        '  "title": "Название урока из учебника",',
        '  "level": "B1",',
        '  "topic": "Тема",',
        '  "description": "Описание урока",',
        '  "pages": [',
        "    {",
        '      "id": "p1",',
        '      "title": "Часть 1: Чтение и Теория",',
        '      "blocks": [',
        '        { "id": "b1", "type": "heading", "level": 1, "text": "Заголовок" },',
        '        { "id": "b2", "type": "text", "text": "Текст учебника..." },',
        '        { "id": "b3", "type": "grammar_card", "title": "Правило", "formula": "Формула", "explanation": "Пояснение", "examples": ["Пример 1"] }',
        "      ]",
        "    },",
        "    {",
        '      "id": "p2",',
        '      "title": "Часть 2: Практика (Упражнения из учебника)",',
        '      "blocks": [',
        '        { "id": "b4", "type": "matching", "instruction": "Соедините слова из упражнения в учебнике:", "pairs": [{"left": "Word", "right": "Solved Match"}] },',
        '        { "id": "b5", "type": "multiple_choice", "question": "Вопрос из учебника?", "options": ["Вариант A", "Вариант B"], "correct": 0, "explanation": "Решение" },',
        '        { "id": "b6", "type": "gap_fill", "instruction": "Заполните пропуски:", "text": "Sentence with [correct_word].", "answers": ["correct_word"] }',
        "      ]",
        "    },",
        "    {",
        '      "id": "p3",',
        '      "title": "Часть 3: Домашнее задание (Vocabulary Homework)",',
        '      "blocks": [',
        '        { "id": "b7", "type": "heading", "level": 2, "text": "Homework: Target Vocabulary" },',
        '        { "id": "b8", "type": "gap_fill", "instruction": "Вставьте ключевые слова урока в предложения:", "text": "The patient suffered from severe [anxiety].", "answers": ["anxiety"] },',

      if (block?.type === 'multiple_choice' || (answer && answer.selected !== undefined)) {
        const selectedIdx = answer?.selected ?? null;
        const isCorrect = block ? (selectedIdx === block.correct) : false;
        const studentOption = (block && selectedIdx !== null) ? (block.options?.[selectedIdx] || ('Вариант #' + selectedIdx)) : (selectedIdx !== null ? ('Вариант #' + selectedIdx) : 'Не отвечено');

            </div>
          </div>

      if (block?.type === 'gap_fill' || (answer && answer.userAnswer !== undefined)) {
        const userAnswer = answer?.userAnswer || '';
        const isCorrect = block ? block.answers?.some(a => a.trim().toLowerCase() === userAnswer.trim().toLowerCase()) : false;

        return (
          <div className={"p-4 border rounded-xl space-y-2 " + (isCorrect ? 'bg-emerald-50/50 border-emerald-200' : 'bg-rose-50/50 border-rose-200')}>

              <span className="text-xs font-bold text-slate-600 uppercase">Заполнение пропуска ({blockId})</span>
              <span className={"text-xs font-bold px-2.5 py-1 rounded-full " + (isCorrect ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800')}>
                {isCorrect ? 'Верно ✅' : 'Ошибка ❌'}
              </span>
            </div>
            {block?.instruction && <p className="text-xs text-slate-500">{block.instruction}</p>}
            {block?.text && <p className="text-sm text-slate-800 font-medium">{block.text}</p>}
            <div className="text-sm space-y-1 pt-1">
              <p><strong className="text-slate-500">Ответ ученика:</strong> <span className={isCorrect ? 'text-emerald-700 font-medium' : 'text-rose-700 font-medium'}>{userAnswer || '(пусто)'}</span></p>
              {!isCorrect && block?.answers && <p><strong className="text-slate-500">Правильный ответ:</strong> <span className="text-emerald-700 font-medium">{block.answers?.join(' или ')}</span></p>}
            </div>
          </div>
        );
      }

      if (block?.type === 'matching' || (answer && answer.matched !== undefined)) {
        const matched = answer?.matched || [];
        return (
          <div className="p-4 bg-slate-50 border border-slate-200 rounded-xl space-y-2">

            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">

                  <span className="font-medium text-slate-700">{m.left}</span>

      return (
        <div className="p-4 bg-slate-50 border rounded-xl">
          <p className="text-xs font-bold text-slate-400 mb-1">Блок #{blockId}</p>
          <pre className="text-sm font-mono text-slate-800 whitespace-pre-wrap">{JSON.stringify(answer, null, 2)}</pre>

    const cleanAndParseJson = (val) => {
      if (!val) return null;
      var tb = String.fromCharCode(96, 96, 96);
      var clean = val.split(tb + 'json').join('').split(tb).join('').trim();
      
      try {
        return JSON.parse(clean);
      } catch (err1) {
        var escSlash = String.fromCharCode(92);
        var fixed = '';
        var inString = false;
        
        for (var i = 0; i < clean.length; i++) {
          var c = clean.charAt(i);
          var code = clean.charCodeAt(i);
          
          if (c === '"' && (i === 0 || clean.charAt(i - 1) !== escSlash)) {
            inString = !inString;
            fixed += c;
          } else if (inString && (code === 10 || code === 13)) {
            fixed += escSlash + 'n';
          } else {
            fixed += c;
          }
        }
        return JSON.parse(fixed);
      }
    };

          body: JSON.stringify({ pageIdx: newIdx, answers: newAnswers })
        }).catch(() => {});
      };

      const handleBlockChange = (blockId, newVal) => {
        const updated = { ...answers, [blockId]: newVal };
        setAnswers(updated);
        sendRoomState(currentPageIdx, updated);
      };

      const handlePageChange = (newIdx) => {
        setCurrentPageIdx(newIdx);
        sendRoomState(newIdx, answers);
      };

      const handleSubmitHomework = async () => {
        let score = 0;
        let total = 0;

        lesson.pages?.forEach(page => {
          page.blocks?.forEach(b => {
            if (b.type === 'multiple_choice' || b.type === 'gap_fill') {
              total++;
              const ans = answers[b.id];
              if (b.type === 'multiple_choice' && ans?.selected === b.correct) score++;
              if (b.type === 'gap_fill' && b.answers?.some(a => a.trim().toLowerCase() === (ans?.userAnswer || '').trim().toLowerCase())) score++;
            }
          });
        });

        await fetch('/api/homework/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            lessonId,
            studentName,
            score,
            totalQuestions: total,
            answers
          })
        });

        setSubmittedHw(true);
      };

      const handleFinishLessonStudent = () => {
        if (isTeacher) {
          onClose();
        } else {
          setIsLessonFinished(true);
        }
      };

      const handleCopy = () => { navigator.clipboard.writeText(studentUrl); setCopied(true); setTimeout(() => setCopied(false), 2000); };

      if (loading) return <div className="text-center py-20 text-slate-400">Загрузка материалов...</div>;
      if (!lesson) return <div className="text-center py-20 bg-white rounded-2xl border p-8"><h3 className="text-xl font-bold mb-2">Урок не найден</h3></div>;

      if (isHomework && !nameEntered) {
        return (
          <div className="max-w-md mx-auto py-16 px-4">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-lg text-center">
              <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl">🏠</div>
              <h3 className="text-2xl font-bold text-slate-900 mb-2">Домашнее задание</h3>
              <p className="text-slate-500 text-sm mb-6">{lesson.title}</p>
              <input
                type="text"
                value={studentName}
                onChange={(e) => setStudentName(e.target.value)}
                placeholder="Введите ваше имя и фамилию..."
                className="w-full px-4 py-3 border border-slate-200 rounded-xl outline-none focus:border-indigo-500 mb-4 font-medium text-center"
              />
              <button
                disabled={!studentName.trim()}
                onClick={() => setNameEntered(true)}
                className="w-full py-3 bg-indigo-600 text-white font-semibold rounded-xl disabled:opacity-50 hover:bg-indigo-700 transition"
              >
                Начать выполнение
              </button>
            </div>
          </div>
        );
      }

      if (submittedHw) {
        return (
          <div className="max-w-md mx-auto py-16 px-4 text-center">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-lg">
              <div className="text-5xl mb-4">🎉</div>
              <h3 className="text-2xl font-bold text-slate-900 mb-2">Отлично сработано, {studentName}!</h3>
              <p className="text-slate-600 text-sm">Ваше домашнее задание успешно отправлено учителю.</p>
            </div>
          </div>
        );
      }

      if (isLessonFinished) {
        return (
          <div className="max-w-md mx-auto py-16 px-4 text-center">
            <div className="bg-white p-8 rounded-2xl border border-slate-200 shadow-lg">
              <div className="text-5xl mb-4">🌟</div>
              <h3 className="text-2xl font-bold text-slate-900 mb-2">Урок завершен!</h3>
              <p className="text-slate-600 text-sm">Вы успешно прошли все материалы урока. Отличная работа!</p>
            </div>
          </div>
        );
      }

      const totalPages = lesson.pages?.length || 1;
      const currentPage = lesson.pages?.[currentPageIdx] || lesson.pages?.[0];
      const progressPct = Math.round(((currentPageIdx + 1) / totalPages) * 100);

      return (
        <div>
          <div className="bg-slate-900 text-white p-4 rounded-2xl mb-6 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg">
            <div className="flex items-center gap-3">
              {isTeacher ? (
                <>
                  <span className={isStudentOnline ? 'w-3 h-3 rounded-full bg-emerald-500 animate-pulse' : 'w-3 h-3 rounded-full bg-slate-500'}></span>
                  <div>
                    <h4 className="font-semibold text-sm">Режим Учителя: {lesson.title}</h4>
                    <p className="text-xs text-slate-400">{isStudentOnline ? '🟢 Ученик онлайн' : '⚪ Ожидание ученика...'}</p>
                  </div>
                </>
              ) : isHomework ? (
                <div>
                  <h4 className="font-semibold text-sm">Домашнее задание: {studentName}</h4>
                  <p className="text-xs text-slate-400">Выполните задания и нажмите «Сдать ДЗ»</p>
                </div>
              ) : (
                <div>
                  <h4 className="font-semibold text-sm">Интерактивный урок: {lesson.title}</h4>
                  <p className="text-xs text-slate-400">Ученик</p>
                </div>
              )}
            </div>

            {isTeacher && (
              <div className="flex gap-3 w-full sm:w-auto">
                <button onClick={handleCopy} className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs font-medium rounded-lg">
                  {copied ? "Ссылка скопирована! ✅" : "Скопировать ссылку ученику"}
                </button>
                <button onClick={onClose} className="px-3 py-2 bg-slate-800 text-xs text-slate-300 rounded-lg">Завершить</button>
              </div>
            )}
          </div>

          <div className="mb-6 max-w-3xl mx-auto">
            <div className="flex justify-between text-xs text-slate-500 mb-2 font-medium">
              <span>Страница {currentPageIdx + 1} из {totalPages}: <strong className="text-slate-800">{currentPage?.title || 'Раздел'}</strong></span>
              <span>{progressPct}% завершено</span>
            </div>
            <div className="w-full bg-slate-200 h-2.5 rounded-full overflow-hidden">
              <div className="bg-indigo-600 h-full transition-all duration-300" style={{ width: progressPct + '%' }}></div>
            </div>
          </div>

          <div className="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm mb-6">
            <div className="space-y-6">
              {currentPage?.blocks?.map(b => (
                <BlockRenderer
                  key={b.id}
                  block={b}
                  value={answers[b.id]}
                  onChange={(newVal) => handleBlockChange(b.id, newVal)}
                  isTeacher={isTeacher}
                />
              ))}
            </div>
          </div>

          <div className="max-w-3xl mx-auto flex justify-between items-center pt-2">
            <button
              disabled={currentPageIdx === 0}
              onClick={() => handlePageChange(currentPageIdx - 1)}
              className="px-6 py-2.5 border border-slate-300 text-slate-700 font-medium rounded-xl disabled:opacity-30 hover:bg-slate-100 transition"
            >
              ← Назад
            </button>

            {currentPageIdx < totalPages - 1 ? (
              <button
                onClick={() => handlePageChange(currentPageIdx + 1)}
                className="px-8 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm"
              >
                Далее →
              </button>
            ) : isHomework ? (
              <button
                onClick={handleSubmitHomework}
                className="px-8 py-2.5 bg-emerald-600 text-white font-medium rounded-xl hover:bg-emerald-700 transition shadow-sm"
              >
                Сдать ДЗ 🎉
              </button>
            ) : (
              <button
                onClick={handleFinishLessonStudent}
                className="px-8 py-2.5 bg-emerald-600 text-white font-medium rounded-xl hover:bg-emerald-700 transition shadow-sm"
              >
                Завершить урок 🎉
              </button>
            )}
          </div>
        </div>
      );
    };

    function App() {
      const [view, setView] = useState('library');
      const [lessons, setLessons] = useState([]);
      const [loading, setLoading] = useState(true);
      const [apiError, setApiError] = useState(null);
      const [activeLessonId, setActiveLessonId] = useState(null);
      const [isTeacher, setIsTeacher] = useState(false);
      const [isHomework, setIsHomework] = useState(false);
      const [isStudentMode, setIsStudentMode] = useState(false);
      const [viewSubmissionsLesson, setViewSubmissionsLesson] = useState(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        const hwId = params.get('homework');
        const role = params.get('role');

        if (roomId) {
          setActiveLessonId(roomId);
          const teacher = role === 'teacher';
          setIsTeacher(teacher);
          setIsHomework(false);
          setIsStudentMode(!teacher);
          setView('room');
        } else if (hwId) {
          setActiveLessonId(hwId);
          setIsTeacher(false);
          setIsHomework(true);
          setIsStudentMode(true);
          setView('room');
        } else {
          loadLessons();
        }
      }, []);

      const loadLessons = () => {
        setLoading(true);
        fetch('/api/lessons')
          .then(res => res.json())
          .then(data => { if (Array.isArray(data)) setLessons(data); setLoading(false); setApiError(null); })
          .catch(err => { setLoading(false); setApiError(err.message); });
      };

      const handleSaveLesson = async (newLesson) => {
        try {
          const res = await fetch('/api/lessons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newLesson)
          });
          const result = await res.json();
          if (!res.ok || result.error) {
            alert("Ошибка сохранения: " + (result.error || "HTTP " + res.status));
            return false;
          }
          await loadLessons();
          setView('library');
          return true;
        } catch (err) {
          alert("Ошибка сети: " + err.message);
          return false;
        }
      };

      const handleDeleteLesson = async (id) => {
        if (!confirm("Удалить этот урок из базы?")) return;
        await fetch('/api/lessons/' + id, { method: 'DELETE' });
        loadLessons();
      };

      const handleExportJson = async (id) => {
        const res = await fetch('/api/lessons/' + id);
        const data = await res.json();
        navigator.clipboard.writeText(JSON.stringify(data, null, 2));
        alert("JSON скопирован в буфер обмена!");
      };

      const handleStartLesson = (id) => {
        setActiveLessonId(id);
        setIsTeacher(true);
        setIsHomework(false);
        setIsStudentMode(false);
        window.history.pushState({}, '', '/?room=' + id + '&role=teacher');
        setView('room');
      };

      const handleStartHomework = (id) => {
        const hwUrl = window.location.origin + '/?homework=' + id;
        navigator.clipboard.writeText(hwUrl);
        alert("Ссылка на Домашнее Задание скопирована в буфер обмена! Отправьте ее ученикам.");
      };

      const handleCloseRoom = () => {
        if (isStudentMode) return;
        window.history.pushState({}, '', window.location.pathname);
        setView('library');
        loadLessons();
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white border-b sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div onClick={handleCloseRoom} className={"flex items-center gap-2 " + (!isStudentMode ? 'cursor-pointer' : '')}>
                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
                <span className="font-bold text-slate-900 text-lg">Lesson Engine</span>
              </div>
              
              {!isStudentMode && view !== 'room' && (
                <nav className="flex gap-1">
                  <button onClick={() => setView('library')} className={view === 'library' ? 'px-4 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700' : 'px-4 py-2 rounded-lg text-sm font-medium text-slate-600'}>Библиотека</button>
                  <button onClick={() => setView('create')} className={view === 'create' ? 'px-4 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700' : 'px-4 py-2 rounded-lg text-sm font-medium text-slate-600'}>+ Создать урок</button>
                  <button onClick={() => setView('prompts')} className={view === 'prompts' ? 'px-4 py-2 rounded-lg text-sm font-medium bg-indigo-50 text-indigo-700' : 'px-4 py-2 rounded-lg text-sm font-medium text-slate-600'}>💡 AI Промпты</button>
                </nav>
              )}
            </div>
          </header>
          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            {view === 'library' && !isStudentMode && (
              <LibraryView
                lessons={lessons}
                loading={loading}
                apiError={apiError}
                onStartLesson={handleStartLesson}
                onStartHomework={handleStartHomework}
                onCreateNew={() => setView('create')}
                onDeleteLesson={handleDeleteLesson}
                onExportJson={handleExportJson}
                onViewSubmissions={(l) => setViewSubmissionsLesson(l)}
              />
            )}
            {view === 'create' && !isStudentMode && <CreateLessonView onSaveLesson={handleSaveLesson} onCancel={() => setView('library')} />}
            {view === 'prompts' && !isStudentMode && <AIPromptsView />}
            {view === 'room' && activeLessonId && (
              <RoomView
                lessonId={activeLessonId}
                isTeacher={isTeacher}
                isHomework={isHomework}
                onClose={handleCloseRoom}
              />
            )}

            {viewSubmissionsLesson && !isStudentMode && (
              <SubmissionsModal
                lesson={viewSubmissionsLesson}
                onClose={() => setViewSubmissionsLesson(null)}
              />
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
