<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Engine MVP</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel standalone for in-browser JSX parsing -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const DEFAULT_LESSON = {
      "version": "1.0",
      "title": "Past Simple: First Steps",
      "description": "Basic lesson covering regular and irregular verbs.",
      "pages": [
        {
          "id": "p1",
          "title": "Page 1",
          "blocks": [
            {
              "id": "b1",
              "type": "heading",
              "level": 1,
              "text": "Welcome to Past Simple!"
            },
            {
              "id": "b2",
              "type": "text",
              "text": "Past Simple is used to talk about actions that happened and finished in the past."
            },
            {
              "id": "b3",
              "type": "multiple_choice",
              "question": "What is the past simple form of the verb 'go'?",
              "options": ["goed", "went", "gone"],
              "correct": 1,
              "explanation": "'Go' is an irregular verb. The past form is 'went'."
            },
            {
              "id": "b4",
              "type": "gap_fill",
              "instruction": "Fill in the blank using the past form of (play):",
              "text": "Yesterday I [played] football with my friends.",
              "answers": ["played"]
            }
          ]
        }
      ]
    };

    // --- BLOCK COMPONENTS ---

    const BlockHeading = ({ block }) => {
      const level = block.level || 2;
      const styles = {
        1: "text-3xl font-bold text-slate-800 mb-4",
        2: "text-2xl font-bold text-slate-800 mb-3",
        3: "text-xl font-semibold text-slate-700 mb-2"
      };
      if (level === 1) return <h1 className={styles[1]}>{block.text}</h1>;
      if (level === 3) return <h3 className={styles[3]}>{block.text}</h3>;
      return <h2 className={styles[2]}>{block.text}</h2>;
    };

    const BlockText = ({ block }) => (
      <p className="text-slate-600 text-lg leading-relaxed mb-4">{block.text}</p>
    );

    const BlockImage = ({ block }) => (
      <div className="my-6">
        <img src={block.url} alt={block.caption || 'Lesson visual'} className="w-full max-h-96 object-cover rounded-xl shadow-md" />
        {block.caption && <p className="text-sm text-slate-500 text-center mt-2">{block.caption}</p>}
      </div>
    );

    const BlockMultipleChoice = ({ block }) => {
      const [selected, setSelected] = useState(null);
      const [submitted, setSubmitted] = useState(false);

      const isCorrect = selected === block.correct;

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          <h4 className="font-semibold text-lg text-slate-800 mb-4">{block.question}</h4>
          <div className="space-y-2 mb-4">
            {block.options.map((option, idx) => {
              let btnStyle = "w-full text-left p-3 rounded-lg border text-slate-700 transition ";
              if (submitted) {
                if (idx === block.correct) btnStyle += "bg-green-50 border-green-500 text-green-900 font-medium";
                else if (idx === selected) btnStyle += "bg-red-50 border-red-500 text-red-900";
                else btnStyle += "border-slate-200 opacity-50";
              } else {
                btnStyle += idx === selected ? "border-indigo-600 bg-indigo-50 text-indigo-900" : "border-slate-200 hover:bg-slate-50";
              }

              return (
                <button
                  key={idx}
                  disabled={submitted}
                  onClick={() => setSelected(idx)}
                  className={btnStyle}
                >
                  {option}
                </button>
              );
            })}
          </div>
          {!submitted ? (
            <button
              disabled={selected === null}
              onClick={() => setSubmitted(true)}
              className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50 hover:bg-indigo-700 transition"
            >
              Check Answer
            </button>
          ) : (
            <div className={`mt-4 p-4 rounded-lg text-sm ${isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              <p className="font-bold mb-1">{isCorrect ? 'Correct! 🎉' : 'Incorrect ❌'}</p>
              {block.explanation && <p>{block.explanation}</p>}
            </div>
          )}
        </div>
      );
    };

    const BlockGapFill = ({ block }) => {
      const [userAnswer, setUserAnswer] = useState('');
      const [submitted, setSubmitted] = useState(false);

      const isCorrect = block.answers.some(
        ans => ans.trim().toLowerCase() === userAnswer.trim().toLowerCase()
      );

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          {block.instruction && <p className="text-slate-600 mb-3">{block.instruction}</p>}
          <div className="flex flex-wrap items-center gap-2 text-lg mb-4">
            <span>{block.text.split(/\[.*?\]/)[0]}</span>
            <input
              type="text"
              value={userAnswer}
              disabled={submitted}
              onChange={(e) => setUserAnswer(e.target.value)}
              className={`border-b-2 outline-none px-2 py-1 text-center font-medium ${
                submitted
                  ? isCorrect ? 'border-green-500 bg-green-50 text-green-900' : 'border-red-500 bg-red-50 text-red-900'
                  : 'border-indigo-500 focus:border-indigo-700'
              }`}
              placeholder="type here"
            />
            <span>{block.text.split(/\[.*?\]/)[1]}</span>
          </div>
          {!submitted ? (
            <button
              disabled={!userAnswer.trim()}
              onClick={() => setSubmitted(true)}
              className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50 hover:bg-indigo-700 transition"
            >
              Check Answer
            </button>
          ) : (
            <div className={`mt-2 p-3 rounded-lg text-sm ${isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              {isCorrect ? 'Correct!' : `Correct answer: ${block.answers.join(' or ')}`}
            </div>
          )}
        </div>
      );
    };

    const BlockRenderer = ({ block }) => {
      switch (block.type) {
        case 'heading': return <BlockHeading block={block} />;
        case 'text': return <BlockText block={block} />;
        case 'image': return <BlockImage block={block} />;
        case 'multiple_choice': return <BlockMultipleChoice block={block} />;
        case 'gap_fill': return <BlockGapFill block={block} />;
        default:
          return (
            <div className="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-lg mb-4 text-sm">
              Unknown block type: <code>{block.type}</code>
            </div>
          );
      }
    };

    // --- MAIN APP ---

    function App() {
      const [jsonInput, setJsonInput] = useState(JSON.stringify(DEFAULT_LESSON, null, 2));
      const [lessonData, setLessonData] = useState(DEFAULT_LESSON);
      const [error, setError] = useState(null);
      const [activeTab, setActiveTab] = useState('preview');

      const handleImport = () => {
        try {
          const parsed = JSON.parse(jsonInput);
          if (!parsed.pages || !Array.isArray(parsed.pages)) {
            throw new Error("JSON must contain a 'pages' array");
          }
          setLessonData(parsed);
          setError(null);
          setActiveTab('preview');
        } catch (err) {
          setError(err.message);
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-8">
          {/* Header */}
          <header className="flex justify-between items-center mb-8 pb-4 border-b border-slate-200">
            <div>
              <h1 className="text-2xl font-bold text-slate-900">Lesson Engine</h1>
              <p className="text-sm text-slate-500">Interactive Lesson Engine v0.1 (MVP)</p>
            </div>
            <div className="flex gap-2 bg-slate-200 p-1 rounded-lg">
              <button
                onClick={() => setActiveTab('editor')}
                className={`px-4 py-2 rounded-md font-medium text-sm transition ${activeTab === 'editor' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Paste JSON
              </button>
              <button
                onClick={() => setActiveTab('preview')}
                className={`px-4 py-2 rounded-md font-medium text-sm transition ${activeTab === 'preview' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-600 hover:text-slate-900'}`}
              >
                Lesson Preview
              </button>
            </div>
          </header>

          {/* Content */}
          {activeTab === 'editor' ? (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <label className="block text-sm font-semibold text-slate-700">Paste AI-generated Lesson JSON:</label>
                <button
                  onClick={handleImport}
                  className="px-6 py-2.5 bg-indigo-600 text-white font-medium rounded-lg hover:bg-indigo-700 transition shadow-sm"
                >
                  Import & Render
                </button>
              </div>
              
              {error && (
                <div className="p-4 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm font-mono">
                  ❌ Invalid JSON: {error}
                </div>
              )}

              <textarea
                rows="20"
                value={jsonInput}
                onChange={(e) => setJsonInput(e.target.value)}
                className="w-full p-4 font-mono text-sm bg-slate-900 text-slate-100 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none"
                placeholder="Paste JSON here..."
              ></textarea>
            </div>
          ) : (
            <main>
              {lessonData ? (
                <div>
                  <div className="mb-6 border-b border-slate-100 pb-4">
                    <h2 className="text-3xl font-extrabold text-slate-900">{lessonData.title}</h2>
                    {lessonData.description && <p className="text-slate-500 mt-1">{lessonData.description}</p>}
                  </div>

                  {lessonData.pages.map((page) => (
                    <div key={page.id} className="space-y-4">
                      {page.blocks.map((block) => (
                        <BlockRenderer key={block.id} block={block} />
                      ))}
                    </div>
                  ))}
                </div>
              ) : (
                <div className="text-center py-12 text-slate-400">No lesson loaded</div>
              )}
            </main>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
