<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen"> 

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const DEFAULT_NEW_JSON = {
      "title": "Новый урок от AI",
      "level": "B1",
      "topic": "Разговорная речь",
      "description": "Описание вашего урока...",
      "pages": [
        {
          "id": "p1",
          "title": "Часть 1",
          "blocks": [
            { "id": "b1", "type": "heading", "level": 1, "text": "Заголовок урока" },
            { "id": "b2", "type": "text", "text": "Текст вводной части..." }
          ]
        }
      ]
    };

    // --- РЕНДЕРЕР БЛОКОВ ---
    const BlockHeading = ({ block }) => {
      const level = block.level || 2;
      const styles = {
        1: "text-3xl font-bold text-slate-800 mb-4",
        2: "text-2xl font-bold text-slate-800 mb-3",
        3: "text-xl font-semibold text-slate-700 mb-2"
      };
      if (level === 1) return <h1 className={styles[1]}>{block.text}</h1>;
      if (level === 3) return <h3 className={styles[3]}>{block.text}</h3>;
      return <h2 className={styles[2]}>{block.text}</h2>;
    };

    const BlockText = ({ block }) => (
      <p className="text-slate-600 text-lg leading-relaxed mb-4">{block.text}</p>
    );

    const BlockImage = ({ block }) => (
      <div className="my-6">
        <img src={block.url} alt={block.caption || 'Visual'} className="w-full max-h-96 object-cover rounded-xl shadow-md" />
        {block.caption && <p className="text-sm text-slate-500 text-center mt-2">{block.caption}</p>}
      </div>
    );

    const BlockMultipleChoice = ({ block }) => {
      const [selected, setSelected] = useState(null);
      const [submitted, setSubmitted] = useState(false);
      const isCorrect = selected === block.correct;

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          <h4 className="font-semibold text-lg text-slate-800 mb-4">{block.question}</h4>
          <div className="space-y-2 mb-4">
            {block.options?.map((option, idx) => {
              let btnStyle = "w-full text-left p-3 rounded-lg border text-slate-700 transition ";
              if (submitted) {
                if (idx === block.correct) btnStyle += "bg-green-50 border-green-500 text-green-900 font-medium";
                else if (idx === selected) btnStyle += "bg-red-50 border-red-500 text-red-900";
                else btnStyle += "border-slate-200 opacity-50";
              } else {
                btnStyle += idx === selected ? "border-indigo-600 bg-indigo-50 text-indigo-900" : "border-slate-200 hover:bg-slate-50";
              }
              return (
                <button key={idx} disabled={submitted} onClick={() => setSelected(idx)} className={btnStyle}>
                  {option}
                </button>
              );
            })}
          </div>
          {!submitted ? (
            <button
              disabled={selected === null}
              onClick={() => setSubmitted(true)}
              className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50 hover:bg-indigo-700 transition"
            >
              Ответить
            </button>
          ) : (
            <div className={`mt-4 p-4 rounded-lg text-sm ${isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              <p className="font-bold mb-1">{isCorrect ? 'Правильно! 🎉' : 'Неверно ❌'}</p>
              {block.explanation && <p>{block.explanation}</p>}
            </div>
          )}
        </div>
      );
    };

    const BlockGapFill = ({ block }) => {
      const [userAnswer, setUserAnswer] = useState('');
      const [submitted, setSubmitted] = useState(false);
      const isCorrect = block.answers?.some(ans => ans.trim().toLowerCase() === userAnswer.trim().toLowerCase());

      return (
        <div className="bg-white p-6 rounded-xl border border-slate-200 shadow-sm mb-6">
          {block.instruction && <p className="text-slate-600 mb-3">{block.instruction}</p>}
          <div className="flex flex-wrap items-center gap-2 text-lg mb-4">
            <span>{block.text?.split(/\[.*?\]/)[0]}</span>
            <input
              type="text"
              value={userAnswer}
              disabled={submitted}
              onChange={(e) => setUserAnswer(e.target.value)}
              className={`border-b-2 outline-none px-2 py-1 text-center font-medium ${
                submitted
                  ? isCorrect ? 'border-green-500 bg-green-50 text-green-900' : 'border-red-500 bg-red-50 text-red-900'
                  : 'border-indigo-500 focus:border-indigo-700'
              }`}
              placeholder="введите ответ"
            />
            <span>{block.text?.split(/\[.*?\]/)[1]}</span>
          </div>
          {!submitted ? (
            <button
              disabled={!userAnswer.trim()}
              onClick={() => setSubmitted(true)}
              className="px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-lg disabled:opacity-50 hover:bg-indigo-700 transition"
            >
              Проверить
            </button>
          ) : (
            <div className={`mt-2 p-3 rounded-lg text-sm ${isCorrect ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
              {isCorrect ? 'Отлично!' : `Правильный ответ: ${block.answers?.join(' или ')}`}
            </div>
          )}
        </div>
      );
    };

    const BlockRenderer = ({ block }) => {
      switch (block.type) {
        case 'heading': return <BlockHeading block={block} />;
        case 'text': return <BlockText block={block} />;
        case 'image': return <BlockImage block={block} />;
        case 'multiple_choice': return <BlockMultipleChoice block={block} />;
        case 'gap_fill': return <BlockGapFill block={block} />;
        default: return <div className="p-4 bg-amber-50 text-amber-800 rounded-lg">Тип блока: {block.type}</div>;
      }
    };

    // --- ЭКРАНЫ ---

    const LibraryView = ({ lessons, loading, apiError, onStartLesson, onCreateNew }) => {
      const [search, setSearch] = useState('');

      const filteredLessons = lessons.filter(l => 
        l.title?.toLowerCase().includes(search.toLowerCase()) || 
        (l.topic && l.topic.toLowerCase().includes(search.toLowerCase()))
      );

      return (
        <div>
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
            <div>
              <h2 className="text-2xl font-bold text-slate-900">Облачная библиотека уроков</h2>
              <p className="text-slate-500 text-sm">Уроки сохранены в базе данных Cloudflare D1</p>
            </div>
            <button
              onClick={onCreateNew}
              className="flex items-center gap-2 px-5 py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition shadow-sm"
            >
              <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4"/></svg>
              Создать урок (JSON)
            </button>
          </div>

          {apiError && (
            <div className="p-4 mb-6 bg-amber-50 border border-amber-200 rounded-xl text-amber-800 text-sm">
              ⚠️ <strong>Предупреждение:</strong> Не удалось подключиться к базе D1 ({apiError}). Убедитесь, что привязали D1 Binding 'DB' в настройках Cloudflare Pages.
            </div>
          )}

          <div className="mb-6">
            <input
              type="text"
              placeholder="Поиск по названию..."
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              className="w-full sm:w-80 px-4 py-2.5 bg-white border border-slate-200 rounded-xl outline-none focus:border-indigo-500 shadow-sm"
            />
          </div>

          {loading ? (
            <div className="text-center py-12 text-slate-400">Загрузка уроков из базы данных...</div>
          ) : filteredLessons.length === 0 ? (
            <div className="text-center py-12 text-slate-400 bg-white rounded-2xl border border-slate-200">
              Пока нет сохраненных уроков. Нажмите «Создать урок», чтобы добавить первый!
            </div>
          ) : (
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
              {filteredLessons.map((lesson) => (
                <div key={lesson.id} className="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm hover:shadow-md transition flex flex-col justify-between">
                  <div>
                    <div className="flex justify-between items-start mb-3">
                      <span className="px-3 py-1 bg-indigo-50 text-indigo-700 font-semibold text-xs rounded-full uppercase">
                        {lesson.level || 'A2-B1'}
                      </span>
                      <span className="text-xs text-slate-400 font-medium">{lesson.topic || 'Общий'}</span>
                    </div>
                    <h3 className="text-xl font-bold text-slate-800 mb-2">{lesson.title}</h3>
                    <p className="text-slate-600 text-sm mb-6 line-clamp-2">{lesson.description}</p>
                  </div>
                  
                  <div className="flex gap-3 pt-4 border-t border-slate-100">
                    <button
                      onClick={() => onStartLesson(lesson.id)}
                      className="flex-1 py-2.5 bg-emerald-600 text-white font-medium rounded-xl hover:bg-emerald-700 transition flex items-center justify-center gap-2 shadow-sm"
                    >
                      <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z"/></svg>
                      Провести урок
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    };

    const CreateLessonView = ({ onSaveLesson, onCancel }) => {
      const [jsonText, setJsonText] = useState(JSON.stringify(DEFAULT_NEW_JSON, null, 2));
      const [parsedLesson, setParsedLesson] = useState(DEFAULT_NEW_JSON);
      const [error, setError] = useState(null);
      const [saving, setSaving] = useState(false);

      const handleJsonChange = (val) => {
        setJsonText(val);
        try {
          const parsed = JSON.parse(val);
          setParsedLesson(parsed);
          setError(null);
        } catch (err) {
          setError(err.message);
        }
      };

      const handleSave = async () => {
        if (error || !parsedLesson) return;
        setSaving(true);
        const newLesson = {
          ...parsedLesson,
          id: 'lesson-' + Date.now()
        };
        await onSaveLesson(newLesson);
        setSaving(false);
      };

      return (
        <div>
          <div className="flex justify-between items-center mb-6">
            <div>
              <h2 className="text-2xl font-bold text-slate-900">Создание нового урока</h2>
              <p className="text-slate-500 text-sm">Вставьте JSON от AI для сохранения в облако</p>
            </div>
            <div className="flex gap-3">
              <button onClick={onCancel} className="px-4 py-2 border border-slate-300 rounded-xl text-slate-700 hover:bg-slate-100 transition">
                Отмена
              </button>
              <button
                onClick={handleSave}
                disabled={!!error || saving}
                className="px-6 py-2 bg-indigo-600 text-white font-medium rounded-xl disabled:opacity-50 hover:bg-indigo-700 transition shadow-sm"
              >
                {saving ? 'Сохранение...' : 'Сохранить в D1'}
              </button>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
              <label className="block text-sm font-semibold text-slate-700 mb-2">JSON Урока:</label>
              {error && <div className="p-3 mb-3 bg-red-50 text-red-700 rounded-lg text-xs font-mono">Ошибка: {error}</div>}
              <textarea
                rows="24"
                value={jsonText}
                onChange={(e) => handleJsonChange(e.target.value)}
                className="w-full p-4 font-mono text-xs bg-slate-900 text-emerald-400 rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"
              ></textarea>
            </div>

            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm max-h-[700px] overflow-y-auto">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">Предпросмотр</h3>
              {parsedLesson && parsedLesson.pages ? (
                <div>
                  <h1 className="text-2xl font-bold text-slate-900 mb-1">{parsedLesson.title}</h1>
                  <p className="text-slate-500 text-sm mb-6">{parsedLesson.description}</p>
                  {parsedLesson.pages.map(page => (
                    <div key={page.id} className="space-y-4">
                      {page.blocks?.map(block => (
                        <BlockRenderer key={block.id} block={block} />
                      ))}
                    </div>
                  ))}
                </div>
              ) : (
                <p className="text-slate-400 text-sm">Некорректная структура JSON</p>
              )}
            </div>
          </div>
        </div>
      );
    };

    const RoomView = ({ lessonId, onClose }) => {
      const [lesson, setLesson] = useState(null);
      const [loading, setLoading] = useState(true);
      const [copied, setCopied] = useState(false);

      const roomUrl = `${window.location.origin}/?room=${lessonId}`;

      useEffect(() => {
        fetch(`/api/lessons/${lessonId}`)
          .then(res => {
            if (!res.ok) throw new Error("Урок не найден");
            return res.json();
          })
          .then(data => {
            setLesson(data);
            setLoading(false);
          })
          .catch(() => setLoading(false));
      }, [lessonId]);

      const handleCopy = () => {
        navigator.clipboard.writeText(roomUrl);
        setCopied(true);
        setTimeout(() => setCopied(false), 2000);
      };

      if (loading) {
        return <div className="text-center py-20 text-slate-400">Загрузка урока из базы данных...</div>;
      }

      if (!lesson) {
        return (
          <div className="text-center py-20 bg-white rounded-2xl border p-8">
            <h3 className="text-xl font-bold text-slate-800 mb-2">Урок не найден</h3>
            <p className="text-slate-500 text-sm mb-4">Возможно, ссылка недействительна или урок еще не был сохранен в базу D1.</p>
            <button onClick={onClose} className="px-5 py-2 bg-indigo-600 text-white rounded-xl">Вернуться в библиотеку</button>
          </div>
        );
      }

      return (
        <div>
          <div className="bg-slate-900 text-white p-4 rounded-2xl mb-8 flex flex-col sm:flex-row justify-between items-center gap-4 shadow-lg">
            <div className="flex items-center gap-3">
              <span className="w-3 h-3 bg-emerald-500 rounded-full animate-pulse"></span>
              <div>
                <h4 className="font-semibold text-sm">Комната: {lesson.title}</h4>
                <p className="text-xs text-slate-400">Ссылка доступна для ученика глобально</p>
              </div>
            </div>

            <div className="flex items-center gap-3 w-full sm:w-auto">
              <button
                onClick={handleCopy}
                className="flex-1 sm:flex-none px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-xs font-medium rounded-lg transition flex items-center justify-center gap-2"
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                {copied ? "Ссылка скопирована! ✅" : "Скопировать ссылку для ученика"}
              </button>
              <button
                onClick={onClose}
                className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 rounded-lg transition"
              >
                Закрыть
              </button>
            </div>
          </div>

          <div className="max-w-3xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
            <h1 className="text-3xl font-extrabold text-slate-900 mb-2">{lesson.title}</h1>
            <p className="text-slate-500 mb-8 pb-4 border-b border-slate-100">{lesson.description}</p>
            
            {lesson.pages?.map(page => (
              <div key={page.id} className="space-y-6">
                {page.blocks?.map(block => (
                  <BlockRenderer key={block.id} block={block} />
                ))}
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- MAIN APP ---
    function App() {
      const [view, setView] = useState('library');
      const [lessons, setLessons] = useState([]);
      const [loading, setLoading] = useState(true);
      const [apiError, setApiError] = useState(null);
      const [activeLessonId, setActiveLessonId] = useState(null);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get('room');
        if (roomId) {
          setActiveLessonId(roomId);
          setView('room');
        } else {
          loadLessons();
        }
      }, []);

      const loadLessons = () => {
        setLoading(true);
        fetch('/api/lessons')
          .then(res => {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(data => {
            if (Array.isArray(data)) setLessons(data);
            setLoading(false);
            setApiError(null);
          })
          .catch(err => {
            setLoading(false);
            setApiError(err.message);
          });
      };

      const handleSaveLesson = async (newLesson) => {
        try {
          await fetch('/api/lessons', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newLesson)
          });
        } catch(e) {}
        loadLessons();
        setView('library');
      };

      const handleStartLesson = (lessonId) => {
        setActiveLessonId(lessonId);
        setView('room');
      };

      const handleCloseRoom = () => {
        window.history.pushState({}, '', window.location.pathname);
        setView('library');
        loadLessons();
      };

      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-white border-b border-slate-200 sticky top-0 z-10">
            <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
              <div 
                onClick={handleCloseRoom}
                className="flex items-center gap-2 cursor-pointer"
              >
                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white font-bold">L</div>
                <span className="font-bold text-slate-900 text-lg">Lesson Engine</span>
              </div>

              {view !== 'room' && (
                <nav className="flex gap-1">
                  <button
                    onClick={() => setView('library')}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'library' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    Библиотека
                  </button>
                  <button
                    onClick={() => setView('create')}
                    className={`px-4 py-2 rounded-lg text-sm font-medium transition ${view === 'create' ? 'bg-indigo-50 text-indigo-700' : 'text-slate-600 hover:text-slate-900'}`}
                  >
                    + Создать урок
                  </button>
                </nav>
              )}
            </div>
          </header>

          <main className="flex-1 max-w-6xl w-full mx-auto px-4 py-8">
            {view === 'library' && (
              <LibraryView
                lessons={lessons}
                loading={loading}
                apiError={apiError}
                onStartLesson={handleStartLesson}
                onCreateNew={() => setView('create')}
              />
            )}

            {view === 'create' && (
              <CreateLessonView
                onSaveLesson={handleSaveLesson}
                onCancel={() => setView('library')}
              />
            )}

            {view === 'room' && activeLessonId && (
              <RoomView
                lessonId={activeLessonId}
                onClose={handleCloseRoom}
              />
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
