<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Lesson Engine</title>
  
  <!-- Preconnect and Load Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Mobile Drag and Drop Polyfill for iPad/Touch Support -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/default.css">
  <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/index.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mobile-drag-drop@2.3.0-rc.2/scroll-behaviour.min.js"></script>
  <script>
    // Initialize polyfill immediately when DOM is ready
    window.addEventListener('DOMContentLoaded', () => {
      MobileDragDrop.polyfill({
        // Prevent default scrolling when dragging a block
        dragImageTranslateOverride: MobileDragDrop.scrollBehaviourDragImageTranslateOverride
      });
    });
    // Prevent iOS rubber-band scrolling when dragging
    window.addEventListener('touchmove', function() {}, {passive: false});
  </script>

  <!-- Central Design System Stylesheet (Built via Tailwind + Vite) -->
  <link rel="stylesheet" href="/src/frontend/theme.css">
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen antialiased selection:bg-indigo-100 selection:text-indigo-900">
  <div id="root"></div>
  <script type="module" src="/src/frontend/main.jsx"></script>
</body>
</html>
